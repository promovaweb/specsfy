interface:
  display_name: "Specsfy - 02 - Backlog"
  short_description: "Refina o backlog e produz um brief testável"
  default_prompt: "Use $specsfy-02-backlog para pesquisar duplicatas e referências, registrar ou atualizar o item em specs/backlog/, resolver uma lacuna por pergunta numerada e entregar um brief testável. Orquestre transições automáticas com anúncio, execução e retomada na mesma conversa até $specsfy-03-specify."
