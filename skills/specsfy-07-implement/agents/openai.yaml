interface:
  display_name: "Specsfy - 07 - Implementar"
  short_description: "Executa as tarefas da spec com TDD e comprovação"
  default_prompt: "Use $specsfy-07-implement para executar a próxima tarefa pronta da seção 14 de specs/<estado>/<NNNN>-<slug>/spec.md: confirme RED, escreva a menor mudança até GREEN, faça a revisão visual e registre a comprovação na spec. Orquestre transições automáticas com anúncio, execução e retomada na mesma conversa."
