interface:
  display_name: "Specsfy - Configuração"
  short_description: "Prepara e monitora o contexto do projeto"
  default_prompt: "Use $specsfy-setup para confirmar a raiz do projeto, ler o sistema existente, reconciliar os arquivos de contexto sem substituir conteúdo humano, conferir a proteção do banco de testes, instalar os especialistas detectados e resolver toda pendência do monitor. Se o contexto já foi reconciliado nesta conversa, siga o caminho curto."
