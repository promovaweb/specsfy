name: CLI

# Validates the Bun CLI in cli/: types, tests, embedded skills, OpenCLI,
# embedded docs and a native build. Releases are built by cli-release.yml.

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Embedded framework scripts match skills/
        run: bun run scripts/embed-skills.ts --check
      - run: bun run validate
      - name: Smoke test the native binary
        run: |
          ./dist/specsfy --version
          ./dist/specsfy --json doctor
          ./dist/specsfy mcp --list
      - name: Wrapper npm version matches the CLI
        run: test "$(bun -p 'require("./package.json").version')" = "$(bun -p 'require("./npm/package.json").version')"
