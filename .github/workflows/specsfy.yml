name: Specsfy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
      - name: Instalar dependências de inspeção do ebook
        run: sudo apt-get install -y libxml2-utils poppler-utils
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture

  skills:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [skills, specialists]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture

  cli:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run check
      - name: Validar artefato versionado
        run: git diff --exit-code -- bin/specsfy bin/specsfy.build.json
      - name: Validar instalação local
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/specsfy-tools" .
          "${RUNNER_TEMP}/specsfy-tools/bin/specsfy" --version
      - name: Validar versão da tag
        if: github.ref_type == 'tag'
        run: |
          version="$(node --print 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Publicar pacote npm
        if: github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "${REPOSITORY_PRIVATE}" = "true" ]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi

  example:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
      - run: composer setup
      - run: composer ci:check
      - run: python3 -B -m unittest discover -s tests -p 'test_documentation.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture
