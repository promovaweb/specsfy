name: Specsfy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Instalar dependências de inspeção do ebook
        run: sudo apt-get install -y libxml2-utils poppler-utils
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture

  skills:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [skills, specialists]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture

  windows-portability-focal:
    name: Windows portability - focal scripts only
    # Focal portability guard; this job does not certify the full Windows suite.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
      - name: Run only the nine focal portability tests, not the full Windows suite
        run: >-
          python -X utf8 -B -m unittest
          skills.tests.test_interface_contract.InterfaceContractTests.test_setup_maps_all_relevant_sources_before_discovery
          skills.tests.test_interface_contract.InterfaceContractTests.test_inspects_the_existing_interface_stack_before_discovery
          skills.tests.test_interface_contract.InterfaceContractTests.test_inspects_each_interface_candidate_without_global_budget_starvation
          skills.tests.test_update_spec.UpdateSpecTests.test_analyzer_reopens_only_the_acts_invalidated_by_the_change
          skills.tests.test_progress.ProgressTests.test_filters_a_spec_by_slug_with_platform_native_paths
          skills.tests.test_minimum_spec_coverage.MinimumTddCoverageTests.test_requires_three_distinct_tdd_case_markers_per_traceable_item
          skills.tests.test_minimum_spec_coverage.MinimumTddCoverageTests.test_accepts_three_distinct_tdd_case_markers_per_traceable_item
          skills.tests.test_minimum_spec_coverage.MinimumTddCoverageTests.test_one_shared_marker_counts_as_one_tdd_case
          skills.tests.test_bdd_runners.BddRunnerTests.test_tdd_marker_covers_acceptance_informed_by_bdd

  cli:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run check
      - name: Validar artefato versionado
        run: git diff --exit-code -- bin/specsfy bin/specsfy.build.json
      - name: Validar instalação local
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/specsfy-tools" .
          "${RUNNER_TEMP}/specsfy-tools/bin/specsfy" --version
      - name: Validar versão da tag
        if: github.ref_type == 'tag'
        run: |
          version="$(node --print 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Publicar pacote npm
        if: github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "${REPOSITORY_PRIVATE}" = "true" ]; then
            npm publish --access public
          else
            npm publish --access public --provenance
          fi

  example:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - run: composer setup
      - run: composer ci:check
      - run: python3 -B -m unittest discover -s tests -p 'test_documentation.py'
      - run: uv run --quiet --with behave==1.3.3 behave tests/features --no-capture
